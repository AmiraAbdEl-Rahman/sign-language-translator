name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install flask numpy tensorflow-cpu pytest scikit-learn matplotlib
      - run: python ml/make_demo_data.py && python ml/train.py --data data/demo --epochs 30
      - run: python -m pytest -q
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
      - run: cd mobile_app && flutter pub get && flutter analyze && flutter test
