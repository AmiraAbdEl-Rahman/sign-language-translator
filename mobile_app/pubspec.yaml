name: sign_language_translator
description: Translates sign language into text and speech in real time.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  http: ^1.2.0
  provider: ^6.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_tts: ^4.0.2
  image: ^4.2.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
